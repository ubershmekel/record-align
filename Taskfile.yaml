# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Install Task: https://taskfile.dev/installation/

version: "3"

vars:
  BUILD_DIR: build
  VERSION: dev

tasks:
  configure:
    desc: Configure the CMake build (run once, or after CMakeLists changes)
    cmds:
      - cmd: cmake -S . -B {{.BUILD_DIR}} -G "Visual Studio 17 2022" -A x64
        platforms: [windows]
      - cmd: cmake -S . -B {{.BUILD_DIR}} -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
        platforms: [darwin]
    generates:
      - "{{.BUILD_DIR}}/CMakeCache.txt"

  build:
    desc: Build the Release binaries
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --config Release --parallel

  test:
    desc: Run the test suite (requires ffmpeg on PATH for import tests)
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} -C Release --output-on-failure

  run:
    desc: Launch the app
    deps: [build]
    cmds:
      - cmd: '"{{.BUILD_DIR}}\Release\record-align.exe"'
        platforms: [windows]
      - cmd: '"{{.BUILD_DIR}}/record-align.app/Contents/MacOS/record-align"'
        platforms: [darwin]

  package:
    desc: "Bundle a distributable zip (task package VERSION=1.2.0)"
    deps: [build]
    cmds:
      - cmd: pwsh -File package.ps1 -Version "{{.VERSION}}"
        platforms: [windows]
      - cmd: ./package-macos.sh "{{.VERSION}}" "{{.BUILD_DIR}}"
        platforms: [darwin]
