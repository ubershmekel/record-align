<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip">
      <rect x="16" y="16" width="168" height="168" rx="32"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="168" height="168" rx="32" fill="#111827"/>

  <!-- Track 1: teal — offset left, converged right -->
  <path d="M20,82 C34,82 42,44 56,44 C70,44 78,120 92,120 C96,120 98,82 100,82"
    fill="none" stroke="#00d9c0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"
    clip-path="url(#clip)"/>
  <path d="M100,82 C102,82 104,44 118,44 C132,44 140,120 154,120 C168,120 176,82 180,82"
    fill="none" stroke="#00d9c0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
    clip-path="url(#clip)"/>

  <!-- Track 2: amber — offset left, converged right -->
  <path d="M20,118 C34,118 42,156 56,156 C70,156 78,80 92,80 C96,80 98,118 100,118"
    fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"
    clip-path="url(#clip)"/>
  <path d="M100,118 C102,118 104,156 118,156 C132,156 140,80 154,80 C168,80 176,118 180,118"
    fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
    clip-path="url(#clip)"/>

  <!-- Alignment marker: bright vertical dashed line -->
  <line x1="100" y1="20" x2="100" y2="180"
    stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.8"
    clip-path="url(#clip)"/>

  <!-- Alignment dots at crossing points -->
  <circle cx="100" cy="82" r="6" fill="#ffffff"/>
  <circle cx="100" cy="118" r="6" fill="#ffffff"/>
</svg>
